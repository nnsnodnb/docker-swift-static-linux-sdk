name: Release

on:
  push:
    tags:
    - '*.*.*'

jobs:
  build:
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    env:
      SWIFT_VERSION: '6.4.1'
      SDK_VERSION: '0.1.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.2.0
      - name: Setup QEMU Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Get the tag name
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "${GITHUB_ENV}"
      - name: Download Swift Static Linux SDK
        run: |
          curl -fsSL -o "swift-${SWIFT_VERSION}-RELEASE_static-linux-${SDK_VERSION}.artifactbundle.tar.gz" \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/static-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_static-linux-${SDK_VERSION}.artifactbundle.tar.gz"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to ghcr.io (resolute)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SWIFT_VERSION=${{ env.SWIFT_VERSION }}
            VARIANT=resolute
            SDK_VERSION=${{ env.SDK_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nnsnodnb/swift-static-linux-sdk:latest
            ghcr.io/nnsnodnb/swift-static-linux-sdk:${{ env.TAG_NAME }}
            ghcr.io/nnsnodnb/swift-static-linux-sdk:${{ env.TAG_NAME }}-resolute
      - name: Build and push to ghcr.io (bookworm)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SWIFT_VERSION=${{ env.SWIFT_VERSION }}
            VARIANT=bookworm
            SDK_VERSION=${{ env.SDK_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nnsnodnb/swift-static-linux-sdk:${{ env.TAG_NAME }}-bookworm
      - name: Build and push to ghcr.io (trixie)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SWIFT_VERSION=${{ env.SWIFT_VERSION }}
            VARIANT=trixie
            SDK_VERSION=${{ env.SDK_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nnsnodnb/swift-static-linux-sdk:${{ env.TAG_NAME }}-trixie
      - name: Build and push to ghcr.io (noble)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SWIFT_VERSION=${{ env.SWIFT_VERSION }}
            VARIANT=noble
            SDK_VERSION=${{ env.SDK_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nnsnodnb/swift-static-linux-sdk:${{ env.TAG_NAME }}-noble
      - name: Build and push to ghcr.io (jammy)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SWIFT_VERSION=${{ env.SWIFT_VERSION }}
            VARIANT=jammy
            SDK_VERSION=${{ env.SDK_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nnsnodnb/swift-static-linux-sdk:${{ env.TAG_NAME }}-jammy
      - name: Build and push to ghcr.io (amazonlinux2023)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SWIFT_VERSION=${{ env.SWIFT_VERSION }}
            VARIANT=amazonlinux2023
            SDK_VERSION=${{ env.SDK_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nnsnodnb/swift-static-linux-sdk:${{ env.TAG_NAME }}-amazonlinux2023
      - name: Build and push to ghcr.io (rhel-ubi9)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SWIFT_VERSION=${{ env.SWIFT_VERSION }}
            VARIANT=rhel-ubi9
            SDK_VERSION=${{ env.SDK_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nnsnodnb/swift-static-linux-sdk:${{ env.TAG_NAME }}-rhel-ubi9
      - name: Build and push to ghcr.io (rhel-ubi10)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SWIFT_VERSION=${{ env.SWIFT_VERSION }}
            VARIANT=rhel-ubi10
            SDK_VERSION=${{ env.SDK_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nnsnodnb/swift-static-linux-sdk:${{ env.TAG_NAME }}-rhel-ubi10
